[project]
name = "djef-personal-algerian-chef"
version = "0.1.0"
description = "A stateful personal Algerian chef built with Streamlit, LangGraph, Gemini, and Tavily."
authors = [{ name = "Kassouar Fatima" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=1.0.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.40.0",
    "tavily-python>=0.7.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.0.0",
    "jupyterlab>=4.0.0",
    "langgraph-cli[inmem]>=0.4.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
